[project]
name = "visualizer"
version = "0.1.0"
description = "LLM-powered data visualization tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy>=2.0",
    "alembic",
    "cryptography",
    "psycopg2-binary",
    "pymysql",
    "pymongo",
    "pandas",
    "numpy",
    "matplotlib",
    "pyarrow",
    "openai",
    "anthropic",
    "litellm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["app*"]
